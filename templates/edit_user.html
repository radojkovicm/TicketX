{% extends "base.html" %}

{% block title %}Edit User - Admin Panel{% endblock %}

{% block content %}
<div class="container">
    <h2>Edit User</h2>
    
    <form method="POST" action="{{ url_for('update_user', user_id=user[0]) }}">
        <div class="row">
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" value="{{ user[1] }}" required>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">New Password (leave empty to keep current)</label>
                    <input type="password" class="form-control" id="password" name="password">
                </div>
                <div class="mb-3">
                    <label for="full_name" class="form-label">Full Name</label>
                    <input type="text" class="form-control" id="full_name" name="full_name" value="{{ user[4] or '' }}" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ user[3] }}">
                </div>
            </div>
            <div class="col-md-6">
                <div class="mb-3">
                    <label for="role" class="form-label">Role</label>
                    <select class="form-select" id="role" name="role" required>
                        <option value="user" {{ 'selected' if user[5] == 'user' else '' }}>User</option>
                        <option value="admin" {{ 'selected' if user[5] == 'admin' else '' }}>Admin</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="department_id" class="form-label">Department</label>
                    <select class="form-select" id="department_id" name="department_id">
                        <option value="">No Department</option>
                        {% for dept in departments %}
                        <option value="{{ dept[0] }}" {{ 'selected' if user[6] == dept[0] else '' }}>{{ dept[1] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="is_department_head" name="is_department_head" {{ 'checked' if user[7] else '' }}>
                    <label class="form-check-label" for="is_department_head">
                        Department Head
                    </label>
                </div>
            </div>
        </div>
        
        <div class="mt-3">
            <button type="submit" class="btn btn-primary">Update User</button>
            <a href="{{ url_for('admin_panel') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
